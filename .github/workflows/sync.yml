name: Sync Data Togel
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tarik Data Keluaran
        run: |
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "https://nomorkiajit.com/hksgpsdy" -o data.html
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.html
          git commit -m "update" || exit 0
          git push
